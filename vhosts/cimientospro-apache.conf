# ==============================================================================
# CONFIGURACIÓN DE VIRTUAL HOSTS BASADOS EN NOMBRE - CIMIENTOSPRO
# Módulo WEAP (Despliegue de Aplicaciones Web / Servicios en Red)
# Servidor: Apache HTTP Server 2.4
# ==============================================================================

# Habilitar escucha en el puerto estándar HTTP
Listen 80

# ------------------------------------------------------------------------------
# 1. VIRTUAL HOST: Sitio Web Corporativo Público (www.cimientospro.com)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName www.cimientospro.com
    ServerAlias cimientospro.com
    ServerAdmin webmaster@cimientospro.com
    
    # Ruta al directorio público (ajustar según entorno Linux o Windows)
    # En Linux: /var/www/cimientospro/www
    # En Windows / XAMPP: C:/Users/u_aldecoafer/Desktop/web/www
    DocumentRoot "C:/Users/u_aldecoafer/Desktop/web/www"
    
    <Directory "C:/Users/u_aldecoafer/Desktop/web/www">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Logs de acceso y error independientes
    ErrorLog "logs/www.cimientospro.com_error.log"
    CustomLog "logs/www.cimientospro.com_access.log" combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 2. VIRTUAL HOST: Portal Privado de la Intranet (intranet.cimientospro.com)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName intranet.cimientospro.com
    ServerAdmin it-soporte@cimientospro.com
    
    # Ruta al directorio de la intranet privada
    DocumentRoot "C:/Users/u_aldecoafer/Desktop/web/intranet"
    
    <Directory "C:/Users/u_aldecoafer/Desktop/web/intranet">
        Options FollowSymLinks
        AllowOverride All
        # Restricción opcional para permitir solo red local (192.168.x.x o 127.0.0.1)
        # Require ip 192.168.1.0/24 127.0.0.1
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog "logs/intranet.cimientospro.com_error.log"
    CustomLog "logs/intranet.cimientospro.com_access.log" combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 3. PROXY INVERSO PARA SUBDOMINIOS DE HERRAMIENTAS (PORTAINER, CODE, BACKUP)
# Requiere módulos: mod_proxy, mod_proxy_http
# ------------------------------------------------------------------------------

# Subdominio Portainer (Gestor Docker en puerto 9000)
<VirtualHost *:80>
    ServerName portainer.cimientospro.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:9000/
    ProxyPassReverse / http://127.0.0.1:9000/
</VirtualHost>

# Subdominio VSCode (code-server en puerto 8443)
<VirtualHost *:80>
    ServerName code.cimientospro.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8443/
    ProxyPassReverse / http://127.0.0.1:8443/
</VirtualHost>

# Subdominio Duplicati (Copias de seguridad en puerto 8200)
<VirtualHost *:80>
    ServerName backup.cimientospro.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8200/
    ProxyPassReverse / http://127.0.0.1:8200/
</VirtualHost>
